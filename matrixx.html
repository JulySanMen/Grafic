<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convoluciones Chidas</title>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="resultado"></canvas>

    <script type="text/javascript">
        var image = new Image();
        image.onload = imageLoaded;
        image.src = "ima.jpeg";

        function imageLoaded() {
            var canvas = document.getElementById("canvas");
            var ctx = canvas.getContext("2d");

            canvas.width = image.width;
            canvas.height = image.height;
            
            ctx.drawImage(image, 0, 0, image.width, image.height);

            var resultado = document.getElementById("resultado");
            resultado.width = image.width;
            resultado.height = image.height;
            
            convolucionar(canvas, resultado);
        }

        function convolucionar(canvasFuente, canvasDestino) {
            var ctxFuente = canvasFuente.getContext("2d");
            var imgDataFuente = ctxFuente.getImageData(0, 0, canvasFuente.width, canvasFuente.height);
            var pixelesFuente = imgDataFuente.data;

            var ctxDestino = canvasDestino.getContext("2d");
            var imgDataDestino = ctxDestino.createImageData(canvasDestino.width, canvasDestino.height);
            var pixelesDestino = imgDataDestino.data;

            var sobelX = [
                [-1, 0, 1],
                [-2, 0, 2],
                [-1, 0, 1]
            ];
            var sobelY = [
                [-1, -2, -1],
                [ 0,  0,  0],
                [ 1,  2,  1]
            ];

            function getPixel(x, y, colorIndex) {
                var idx = ((y * canvasFuente.width) + x) * 4 + colorIndex;
                return pixelesFuente[idx];
            }

            for (var y = 1; y < canvasFuente.height - 1; y++) {
                for (var x = 1; x < canvasFuente.width - 1; x++) {
                    for (var colorIndex = 0; colorIndex < 3; colorIndex++) {
                        var gx = 0, gy = 0;
                        for (var ky = -1; ky <= 1; ky++) {
                            for (var kx = -1; kx <= 1; kx++) {
                                gx += sobelX[ky + 1][kx + 1] * getPixel(x + kx, y + ky, colorIndex);
                                gy += sobelY[ky + 1][kx + 1] * getPixel(x + kx, y + ky, colorIndex);
                            }
                        }
                        var mag = Math.sqrt(gx * gx + gy * gy);
                        mag = Math.min(255, mag);  // Limita a 255
                        var idx = ((y * canvasFuente.width) + x) * 4 + colorIndex;
                        pixelesDestino[idx] = mag;
                    }
                    pixelesDestino[((y * canvasFuente.width) + x) * 4 + 3] = 255; // Alpha
                }
            }
            ctxDestino.putImageData(imgDataDestino, 0, 0);
        }
    </script>
</body>
</html>
